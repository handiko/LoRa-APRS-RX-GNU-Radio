<text x="90.0" y="472.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Why the asymmetry? The Semtech chip puts each symbol on the lowest bin of a group of 4, so readings 1–3 bins high are absorbed, 1 bin low is not (see next figure).</text>
