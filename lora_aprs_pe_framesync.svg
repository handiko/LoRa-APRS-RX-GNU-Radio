<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="The five stages of the Frame Sync block">
<title>The five stages of the Frame Sync block</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Inside EPB 1 (Frame Sync): what happens to every frame</text>
<rect x="30.0" y="55.0" width="190.0" height="230.0" rx="10" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.5"/>
<text x="125.0" y="78.0" font-size="14" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">① LISTEN</text>
<text x="125.0" y="110.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">un-sweep blindly,</text>
<text x="125.0" y="132.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slice after slice</text>
<text x="125.0" y="154.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central"></text>
<text x="125.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">3 slices in a row with</text>
<text x="125.0" y="198.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">the peak in one bin</text>
<text x="125.0" y="220.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">→ a preamble!</text>
<path d="M220.0 170.0 L243.0 170.0" fill="none" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#ahc)"/>
<rect x="245.0" y="55.0" width="190.0" height="230.0" rx="10" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.5"/>
<text x="340.0" y="78.0" font-size="14" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">② FINE-TUNE</text>
<text x="340.0" y="110.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">phase creep between</text>
<text x="340.0" y="132.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slices → the fraction</text>
<text x="340.0" y="154.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">of a bin of tuning error</text>
<text x="340.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central"></text>
<text x="340.0" y="198.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">try 4 sampling moments,</text>
<text x="340.0" y="220.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">keep the sharpest</text>
<path d="M435.0 170.0 L458.0 170.0" fill="none" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#ahc)"/>
<rect x="460.0" y="55.0" width="190.0" height="230.0" rx="10" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.5"/>
<text x="555.0" y="78.0" font-size="14" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">③ LINE UP</text>
<text x="555.0" y="110.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slide the slices by the</text>
<text x="555.0" y="132.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">preamble's bin number</text>
<text x="555.0" y="154.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central"></text>
<text x="555.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">now preamble chirps</text>
<text x="555.0" y="198.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">read 0 and the sync</text>
<text x="555.0" y="220.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">word reads 8, 16</text>
<path d="M650.0 170.0 L673.0 170.0" fill="none" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#ahc)"/>
<rect x="675.0" y="55.0" width="190.0" height="230.0" rx="10" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.5"/>
<text x="770.0" y="78.0" font-size="14" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">④ FIND MARKER</text>
<text x="770.0" y="110.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">first slice where the</text>
<text x="770.0" y="132.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">down-chirp test wins</text>
<text x="770.0" y="154.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">= the SFD</text>
<text x="770.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">check network ID 8, 16</text>
<text x="770.0" y="198.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">(allowing clock drift)</text>
<text x="770.0" y="220.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">SFD bin = 2 × tuning error</text>
<path d="M865.0 170.0 L888.0 170.0" fill="none" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#ahc)"/>
<rect x="890.0" y="55.0" width="190.0" height="230.0" rx="10" fill="#FBEAD7" stroke="#B45309" stroke-width="2.2"/>
<text x="985.0" y="78.0" font-size="14" fill="#B45309" font-weight="700" text-anchor="middle" dominant-baseline="central">⑤ DELIVER + TRACK</text>
<text x="985.0" y="110.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">one corrected slice per</text>
<text x="985.0" y="132.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">symbol, header first</text>
<text x="985.0" y="154.0" font-size="12" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central"></text>
<text x="985.0" y="176.0" font-size="12" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">NEW: re-centre the</text>
<text x="985.0" y="198.0" font-size="12" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">frequency after every</text>
<text x="985.0" y="220.0" font-size="12" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">symbol (follows drift)</text>
<path d="M770.0 285.0 L770.0 330.0 L145.0 330.0 L145.0 287.0" fill="none" stroke="#6b6b66" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="447.5" y="320.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">wrong network ID, or no marker after the preamble → back to listening</text>
<path d="M955.0 285.0 L955.0 365.0 L105.0 365.0 L105.0 287.0" fill="none" stroke="#6b6b66" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="555.0" y="355.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">frame complete (or header rejected) → back to listening</text>
<rect x="965.0" y="395.0" width="190.0" height="50.0" rx="8" fill="#ffffff" stroke="#3d3d3a" stroke-width="1.3"/>
<text x="1060.0" y="412.6" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="middle" dominant-baseline="central">from EPB 2 (decoder)</text>
<text x="1060.0" y="427.4" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">"this frame is 93 symbols"</text>
<path d="M1045.0 395.0 L1045.0 287.0" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahc)"/>
<text x="30.0" y="410.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Stages ② ③ ④ happen once per frame, in a fraction of a second.</text>
<text x="30.0" y="428.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Stage ⑤ runs for the whole 3 s of header + payload, and is where the frequency tracking lives.</text>
</svg>
