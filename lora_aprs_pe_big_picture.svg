<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="LoRa APRS receiver: the whole signal chain">
<title>LoRa APRS receiver: the whole signal chain</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">The whole receiver, left to right and top to bottom</text>
<rect x="30.0" y="50.0" width="200.0" height="90.0" rx="8" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="130.0" y="72.7" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">RTL-SDR dongle</text>
<text x="130.0" y="88.9" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">Soapy RTL-SDR Source</text>
<text x="130.0" y="103.8" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">tuned to 431.950 MHz</text>
<text x="130.0" y="118.6" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">1,000,000 samples/s</text>
<rect x="290.0" y="50.0" width="240.0" height="90.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="410.0" y="72.7" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Frequency Xlating FIR</text>
<text x="410.0" y="88.9" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slide +200 kHz → 0 Hz</text>
<text x="410.0" y="103.8" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">keep ±80 kHz, keep every 2nd</text>
<text x="410.0" y="118.6" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">→ 500,000 samples/s</text>
<rect x="600.0" y="50.0" width="270.0" height="90.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="735.0" y="72.7" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">EPB 1 · Frame Sync</text>
<text x="735.0" y="88.9" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">find the frame, measure errors,</text>
<text x="735.0" y="103.8" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">line up the slices, TRACK frequency</text>
<text x="735.0" y="118.6" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">→ one 4096-sample slice per symbol</text>
<path d="M230.0 95.0 L288.0 95.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M530.0 95.0 L598.0 95.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="30.0" y="170.0" width="200.0" height="46.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="130.0" y="186.2" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Waterfall display</text>
<text x="130.0" y="201.1" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">what the dongle sees</text>
<path d="M130.0 140.0 L130.0 168.0" fill="none" stroke="#6b6b66" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="290.0" y="170.0" width="240.0" height="46.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="410.0" y="186.2" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Blind monitor → time plot</text>
<text x="410.0" y="201.1" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">un-sweeps without lining up</text>
<path d="M410.0 140.0 L410.0 168.0" fill="none" stroke="#6b6b66" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="30.0" y="280.0" width="165.0" height="74.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="112.5" y="302.2" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Stream to Vector</text>
<text x="112.5" y="317.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">4096 samples →</text>
<text x="112.5" y="332.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">one slice</text>
<rect x="225.0" y="280.0" width="175.0" height="74.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="312.5" y="302.2" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Multiply Const</text>
<text x="312.5" y="317.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">× down-chirp</text>
<text x="312.5" y="332.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">(the "un-sweep")</text>
<rect x="430.0" y="280.0" width="150.0" height="74.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="505.0" y="302.2" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">FFT 4096</text>
<text x="505.0" y="317.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">steady tone →</text>
<text x="505.0" y="332.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">one tall bin</text>
<rect x="610.0" y="280.0" width="150.0" height="74.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="685.0" y="302.2" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Complex to Mag²</text>
<text x="685.0" y="317.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">strength of</text>
<text x="685.0" y="332.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">each bin</text>
<rect x="790.0" y="280.0" width="150.0" height="74.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="865.0" y="302.2" font-size="12" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Argmax</text>
<text x="865.0" y="317.7" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">strongest bin</text>
<text x="865.0" y="332.5" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">= symbol value</text>
<path d="M735.0 140.0 L735.0 245.0 L112.0 245.0 L112.0 278.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="420.0" y="233.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">aligned, corrected slices (one per symbol)</text>
<path d="M195.0 317.0 L223.0 317.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M400.0 317.0 L428.0 317.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M580.0 317.0 L608.0 317.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M760.0 317.0 L788.0 317.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="430.0" y="390.0" width="150.0" height="46.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="505.0" y="406.2" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Vector display</text>
<text x="505.0" y="421.1" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">latest symbol spectrum</text>
<path d="M505.0 354.0 L505.0 388.0" fill="none" stroke="#6b6b66" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="700.0" y="470.0" width="230.0" height="84.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="815.0" y="497.1" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">EPB 2 · PHY Decoder</text>
<text x="815.0" y="513.3" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">Gray · de-interleave · Hamming</text>
<text x="815.0" y="528.2" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">header · de-whiten · CRC-16</text>
<rect x="965.0" y="470.0" width="120.0" height="84.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="1025.0" y="489.7" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">EPB 3</text>
<text x="1025.0" y="505.9" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">APRS Parser</text>
<text x="1025.0" y="520.8" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">strip &lt;FF01</text>
<text x="1025.0" y="535.6" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">read TNC2</text>
<path d="M865.0 354.0 L865.0 468.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="872.0" y="385.0" font-size="11" fill="#2b2b29" font-weight="600" text-anchor="start" dominant-baseline="central">symbol values</text>
<path d="M930.0 512.0 L963.0 512.0" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahc)"/>
<text x="947.0" y="498.0" font-size="10" fill="#A32D2D" font-weight="600" text-anchor="middle" dominant-baseline="central">packet</text>
<rect x="965.0" y="585.0" width="120.0" height="46.0" rx="8" fill="#FDF0DC" stroke="#B45309" stroke-width="1.3"/>
<text x="1025.0" y="601.2" font-size="12" fill="#B45309" font-weight="700" text-anchor="middle" dominant-baseline="central">Console + log</text>
<text x="1025.0" y="616.1" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">decoded APRS</text>
<path d="M1025.0 554.0 L1025.0 583.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M760.0 470.0 L760.0 430.0 L980.0 430.0 L980.0 95.0 L872.0 95.0" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahc)"/>
<text x="990.0" y="260.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">frame length,</text>
<text x="990.0" y="275.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">read from the</text>
<text x="990.0" y="290.0" font-size="11" fill="#A32D2D" font-weight="600" text-anchor="start" dominant-baseline="central">header</text>
<rect x="30.0" y="512.0" width="22.0" height="16.0" rx="4" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="58.0" y="520.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">hardware</text>
<rect x="129.3" y="512.0" width="22.0" height="16.0" rx="4" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.2"/>
<text x="157.3" y="520.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">stock GNU Radio block</text>
<rect x="30.0" y="540.0" width="22.0" height="16.0" rx="4" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.2"/>
<text x="58.0" y="548.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Embedded Python Block</text>
<rect x="209.4" y="540.0" width="22.0" height="16.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2"/>
<text x="237.4" y="548.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">display</text>
<path d="M30.0 580.0 L70.0 580.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="78.0" y="580.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">sample stream</text>
<path d="M200.0 580.0 L240.0 580.0" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ahc)"/>
<text x="248.0" y="580.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">message (sent once per frame)</text>
<text x="30.0" y="615.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Everything that un-sweeps and reads a symbol (row 2) is a stock block. The three EPBs do only what</text>
<text x="30.0" y="632.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">GNU Radio has no block for: deciding where to cut, LoRa bit-level decoding, and APRS text parsing.</text>
</svg>
