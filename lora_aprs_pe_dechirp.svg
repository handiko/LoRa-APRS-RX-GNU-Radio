<polyline points="425.3,320.0 540.0,259.0" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round" stroke-opacity="1"/>
<path d="M425.3 70.0 L425.3 320.0" fill="none" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 3"/>
<polyline points="70.0,70.0 540.0,320.0" fill="none" stroke="#B45309" stroke-width="2.4" stroke-linejoin="round" stroke-opacity="1"/>
<polyline points="70.0,134.0 540.0,134.0" fill="none" stroke="#15803d" stroke-width="3" stroke-linejoin="round" stroke-opacity="1"/>
<text x="113.0" y="275.0" font-size="11" fill="#1d4ed8" font-weight="700" text-anchor="start" dominant-baseline="central">received chirp (symbol 1000)</text>
<text x="431.3" y="175.0" font-size="10" fill="#1d4ed8" font-weight="400" text-anchor="start" dominant-baseline="central">fold: jumps</text>
<text x="431.3" y="188.0" font-size="10" fill="#1d4ed8" font-weight="400" text-anchor="start" dominant-baseline="central">to the bottom</text>
<text x="414.2" y="241.0" font-size="11" fill="#B45309" font-weight="700" text-anchor="middle" dominant-baseline="central">reference down-chirp</text>
<text x="299.5" y="122.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="middle" dominant-baseline="central">sum = steady tone at 1000 × 30.5 Hz = 30.5 kHz</text>
