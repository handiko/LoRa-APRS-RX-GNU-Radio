<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Un-sweeping a chirp turns it into one steady tone, which the FFT puts in one bin">
<title>Un-sweeping a chirp turns it into one steady tone, which the FFT puts in one bin</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="22.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">The core trick: rising chirp × falling reference = steady tone → one FFT bin</text>
<rect x="70.0" y="60.0" width="470.0" height="270.0" rx="2" fill="#ffffff" stroke="#d4d4cf" stroke-width="1"/>
<path d="M70.0 320.0 L540.0 320.0" fill="none" stroke="#ececE8" stroke-width="1"/>
<text x="64.0" y="320.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-62.5</text>
<path d="M70.0 257.5 L540.0 257.5" fill="none" stroke="#ececE8" stroke-width="1"/>
<text x="64.0" y="257.5" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-31.25</text>
<path d="M70.0 195.0 L540.0 195.0" fill="none" stroke="#ececE8" stroke-width="1"/>
<text x="64.0" y="195.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">0</text>
<path d="M70.0 132.5 L540.0 132.5" fill="none" stroke="#ececE8" stroke-width="1"/>
<text x="64.0" y="132.5" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">31.25</text>
<path d="M70.0 70.0 L540.0 70.0" fill="none" stroke="#ececE8" stroke-width="1"/>
<text x="64.0" y="70.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">62.5</text>
<text x="24.0" y="195.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">kHz</text>
<text x="70.0" y="342.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">0</text>
<text x="184.7" y="342.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">8</text>
<text x="299.5" y="342.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">16</text>
<text x="414.2" y="342.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">24</text>
<text x="529.0" y="342.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">32</text>
<text x="305.0" y="358.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">time within one symbol (ms) — SF12: 32.8 ms</text>
