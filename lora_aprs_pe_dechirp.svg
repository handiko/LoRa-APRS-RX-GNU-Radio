<text x="580.0" y="181.0" font-size="11" fill="#2b2b29" font-weight="600" text-anchor="middle" dominant-baseline="central">FFT</text>
<text x="30.0" y="385.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">The whole symbol's energy ends up in one of 4096 bins, while noise is shared by all of them: a 36 dB lift, which is why SF12 works below the noise.</text>
</svg>
