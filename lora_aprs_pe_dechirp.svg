<text x="959.9" y="342.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">4095</text>
<text x="790.0" y="358.0" font-size="11" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">FFT bin (each bin is 30.5 Hz wide)</text>
