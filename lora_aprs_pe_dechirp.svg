<text x="709.0" y="86.0" font-size="11" fill="#15803d" font-weight="700" text-anchor="start" dominant-baseline="central">bin 1000 = the symbol value</text>
<text x="790.0" y="300.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">noise stays spread over all 4096 bins</text>
